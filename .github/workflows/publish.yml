name: Publish VS Code Extensions
on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        type: choice
        options:
          - open-vsx
          - archive
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish-openvsx:
    if: ${{ github.event.inputs.publish_target == 'open-vsx' }}
    needs: build
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: |
          git submodule init
          git submodule update
        name: Checkout VS Code
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: vscode/.nvmrc
      - name: Install dependencies
        run: npm i
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Check ovsx version
        run: npx ovsx --version
      - name: Create built-in extensions pack
        run: npm run create-extension-pack
      - name: Publish Extensions to open-vsx.org
        run: npm run publish:vsix

  publish-archive:
    if: ${{ github.event.inputs.publish_target == 'archive' }}
    needs: build
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: |
          git submodule init
          git submodule update
        name: Checkout VS Code
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: vscode/.nvmrc
      - name: Install dependencies
        run: npm i
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Get external builtins
        run: npm run get-external-builtins
      - name: Compress VSIX files
        run: npm run compress-vsix 2>&1 | tee compress-vsix.log
      - name: Upload archive artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vscode-builtin-extensions-archive
          path: vscode-builtin-extensions-*.tar.gz
          retention-days: 7
      - name: Get VS Code version
        run: echo "VSCODE_VERSION=$(node -p "require('./vscode/package.json').version")" >> $GITHUB_ENV
      - name: Create GitHub release
        shell: bash
        run: |
          COMPRESS_LOG=$(cat compress-vsix.log)
          cat > release-notes.md <<EOF
          VS Code built-in extensions v${{ env.VSCODE_VERSION }} including external built-ins (defined in VS Code's product.json, under the namespace ms-vscode)

          IP checks were completed:
          - <!-- Add IP check links here -->

          <details>
          <summary>Contents</summary>

          ${COMPRESS_LOG}

          </details>
          EOF
          # Remove leading whitespace added by indentation
          sed -i 's/^          //' release-notes.md
          gh release create "${{ env.VSCODE_VERSION }}" \
            --title "VS Code built-in extensions ${{ env.VSCODE_VERSION }}" \
            --notes-file release-notes.md \
            --target ${{ github.sha }} \
            vscode-builtin-extensions-${{ env.VSCODE_VERSION }}.tar.gz \
            dist/*.vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
